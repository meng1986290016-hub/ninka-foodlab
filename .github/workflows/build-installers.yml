name: Build unsigned desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            command: desktop:bundle:macos
            artifact: macos-arm64
          - label: macOS Intel
            os: macos-15-intel
            command: desktop:bundle:macos
            artifact: macos-x64
          - label: Windows x64
            os: windows-2025
            command: desktop:bundle:windows
            artifact: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install brand verification dependencies
        run: python -m pip install -r scripts/branding/requirements.txt

      - name: Prepare embedded Agent runtime
        run: pnpm agent-runtime:prepare

      - name: Verify frontend and brand assets
        env:
          PYTHONPATH: scripts/branding
        run: |
          pnpm licenses:generate
          pnpm open-source:verify
          pnpm --filter @food-rd/core build
          pnpm typecheck
          python scripts/branding/verify_assets.py

      - name: Build installer
        run: pnpm ${{ matrix.command }}

      - name: Verify embedded Agent runtime in macOS app bundle
        if: runner.os == 'macOS'
        run: pnpm agent-runtime:verify

      - name: Install Windows bundle and verify embedded Agent runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)

          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows NSIS installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $installRoot = Join-Path $env:RUNNER_TEMP "NinkaFoodLabVerify"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installRoot") -PassThru

          if (-not $process.WaitForExit(600000)) {
            Stop-Process -Id $process.Id -Force
            throw "Windows NSIS installer did not finish within ten minutes."
          }

          if ($process.ExitCode -ne 0) {
            throw "Windows NSIS installer exited with code $($process.ExitCode)."
          }

          foreach ($required in @("food-rd-desktop.exe", "food_rd_mcp.exe", "foodlab-agent-node.exe", "agent-runtime/runtime-manifest.json")) {
            if (-not (Test-Path (Join-Path $installRoot $required))) {
              throw "Windows installation is missing $required."
            }
          }

          pnpm agent-runtime:verify -- "$installRoot"
          $env:FOODLAB_INSTALLED_RUNTIME_ROOT = Join-Path $installRoot "agent-runtime"
          $env:FOODLAB_INSTALLED_NODE_BINARY = Join-Path $installRoot "foodlab-agent-node.exe"
          $env:FOODLAB_INSTALLED_MCP_BINARY = Join-Path $installRoot "food_rd_mcp.exe"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib installed_runtime_matches_the_rust_host_contract_when_requested
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib installed_agent_service_starts_when_requested

      - name: Create non-interactive DMG
        if: runner.os == 'macOS'
        run: pnpm desktop:bundle:macos:dmg

      - name: Collect installer and checksum
        run: pnpm desktop:artifacts

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: food-rd-studio-${{ matrix.artifact }}
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 14
