[package]
name = "food-rd-desktop"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
default-run = "food-rd-desktop"

[lib]
name = "food_rd_desktop"
path = "src/lib.rs"

[[bin]]
name = "food_rd_mcp"
path = "src/bin/food_rd_mcp.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
calamine = "0.31"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
lopdf = "0.38"
mime_guess = "2"
pdf-extract = "0.10"
quick-xml = "0.38"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
rust_xlsxwriter = "0.92"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-std", "io-util", "time", "sync", "rt-multi-thread", "macros", "net"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
wiremock = "0.6"

[build-dependencies]
sha2 = "0.10"
tauri-build = { version = "2", features = [] }
