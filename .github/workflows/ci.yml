name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-cli-contract:
    name: Windows CLI contract (fast)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - name: Prepare CI sidecar placeholder
        shell: bash
        run: |
          target="$(rustc --version --verbose | sed -n 's/^host: //p')"
          if [ -z "$target" ]; then
            echo "Unable to determine the Rust host target" >&2
            exit 1
          fi
          mkdir -p apps/desktop/src-tauri/binaries
          mkdir -p apps/desktop/src-tauri/generated/agent-runtime
          touch "apps/desktop/src-tauri/binaries/foodlab-agent-node-${target}.exe"
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test cli_provider_contract

  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Prepare CI sidecar placeholder
        shell: bash
        run: |
          target="$(rustc --version --verbose | sed -n 's/^host: //p')"
          if [ -z "$target" ]; then
            echo "Unable to determine the Rust host target" >&2
            exit 1
          fi
          suffix=""
          case "$target" in
            *-windows-*) suffix=".exe" ;;
          esac
          mkdir -p apps/desktop/src-tauri/binaries
          mkdir -p apps/desktop/src-tauri/generated/agent-runtime
          touch "apps/desktop/src-tauri/binaries/foodlab-agent-node-${target}${suffix}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm open-source:verify
      - run: pnpm --filter @food-rd/core build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
